name: VPN Gate Node Check

on:
  workflow_dispatch:
    inputs:
      check_worker:
        description: "可选：本次运行使用的检测 Worker URL；定时运行请设置仓库变量 CHECK_WORKER"
        required: false
        type: string
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    # 定时任务在配置好 CHECK_WORKER 前不会执行检测
    if: ${{ github.event_name != 'schedule' || vars.CHECK_WORKER != '' }}
    env:
      CHECK_WORKER: ${{ github.event.inputs.check_worker || vars.CHECK_WORKER }}
      NODES_URL: "https://Yeon-886.github.io/gate/nodes.txt"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate SSTP detection Worker URL
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          url = os.environ.get("CHECK_WORKER", "").strip()
          try:
              parsed = urlsplit(url)
              host = parsed.hostname or ""
          except ValueError:
              parsed, host = None, ""
          if (not parsed or parsed.scheme != "https" or "." not in host
                  or "你的域名" in host or parsed.path != "/check"
                  or parsed.query != "sstp=vpn:vpn@"):
              raise SystemExit("::error::CHECK_WORKER 未配置或格式不正确。请先部署 CheckSocks5 Worker，并在仓库 Settings > Secrets and variables > Actions > Variables 设置 CHECK_WORKER，例如 https://your-checker.workers.dev/check?sstp=vpn:vpn@。手动运行也可以填写 check_worker 输入参数。")
          print("CHECK_WORKER 格式检查通过")
          PY

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://Yeon-886.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
