name: VPN Gate Node Check

on:
  workflow_dispatch:
    inputs:
      check_worker:
        description: "可选：覆盖检测 Worker 地址；留空使用仓库变量或已配置的默认地址"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/check.yml'
      - 'vpngate.py'
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    env:
      # 公开检测服务地址，不是令牌。临时输入和仓库变量仍可覆盖默认值。
      CHECK_WORKER: ${{ github.event.inputs.check_worker || vars.CHECK_WORKER || 'https://cm-workers-checksocks5.asfhjbcueirew.workers.dev/check?sstp=vpn:vpn@' }}
      NODES_URL: "https://Yeon-886.github.io/gate/nodes.txt"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate and probe SSTP detection Worker
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit
          import requests

          def normalize_worker(value):
              value = value.strip()
              if not value or any(c in value for c in "\r\n"):
                  raise ValueError("CHECK_WORKER 为空或包含换行")
              if "://" not in value:
                  value = "https://" + value
              parsed = urlsplit(value)
              if parsed.path in ("", "/") and not parsed.query:
                  parsed = parsed._replace(path="/check", query="sstp=vpn:vpn@")
              host = parsed.hostname or ""
              if (parsed.scheme != "https" or "." not in host
                      or "你的域名" in host or parsed.username is not None
                      or parsed.password is not None or parsed.fragment
                      or parsed.path != "/check"
                      or parsed.query != "sstp=vpn:vpn@"):
                  raise ValueError("请填写检测 Worker 域名或完整的 /check?sstp=vpn:vpn@ 地址")
              return urlunsplit(parsed)

          def main():
              try:
                  url = normalize_worker(os.environ.get("CHECK_WORKER", ""))
              except ValueError as exc:
                  print(f"::error::{exc}")
                  raise SystemExit(1)
              probe = urlunsplit(urlsplit(url)._replace(query=""))
              print(f"检测接口预检: {probe}")
              try:
                  response = requests.get(probe, timeout=20, allow_redirects=False)
              except requests.RequestException as exc:
                  print(f"::error::检测 Worker 无法访问: {type(exc).__name__}")
                  raise SystemExit(1)
              try:
                  payload = response.json()
              except ValueError:
                  payload = {}
              # 不连接任何 VPN：缺少参数时，正确的检测代码返回带 SSTP 提示的 400 JSON。
              error = str(payload.get("error", "")) if isinstance(payload, dict) else ""
              valid = (response.status_code == 400 and isinstance(payload, dict)
                       and payload.get("success") is False
                       and "missing proxy parameter" in error.lower()
                       and "sstp" in error.lower())
              if not valid:
                  print(f"Worker HTTP 状态: {response.status_code}")
                  print("响应片段: " + repr(response.text[:300]))
                  if response.status_code == 404:
                      print("::error::检测 Worker 返回 404；不是 CHECK_WORKER 变量格式错误。请在 Cloudflare 确认 cm-workers-checksocks5 已部署 _worker.js 且 workers.dev 路由启用；仓库 wrangler.toml 的 name 必须匹配该 Worker。")
                  else:
                      print("::error::该地址未返回预期的 SSTP 检测 API。检查生产部署、访问控制和 _worker.js 入口。")
                  raise SystemExit(1)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
                  output.write("CHECK_WORKER=" + url + "\n")
              print("SSTP 检测接口可访问；继续实际节点检测。")

          if __name__ == "__main__":
              main()
          PY

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Verify non-empty SSTP node output
        run: |
          if ! grep -q '\$sstp://' public/nodes.txt; then
            echo "::error::没有检测成功的 SSTP 节点，保留上次发布结果，不部署空清单。"
            exit 1
          fi

      - name: Verify GitHub Pages is enabled
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "GitHub Pages API status: $status"
          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages 尚未启用。请打开仓库 Settings > Pages > Build and deployment，将 Source 设置为 GitHub Actions，再重新运行工作流。"
            exit 1
          elif [ "$status" != "200" ]; then
            cat "$response_file"
            echo "::error::GitHub Pages 状态检查失败 (HTTP $status)。"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://Yeon-886.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
